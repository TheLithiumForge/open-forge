name: Build

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

env:
  DOTNET_MULTILEVEL_LOOKUP: "0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.111"
      - run: npm run setup
      - run: npm run verify

  build:
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RID: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-24.04, architecture: x64 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm, architecture: arm64 }
          - { rid: osx-x64, runner: macos-15-intel, architecture: x64 }
          - { rid: osx-arm64, runner: macos-15, architecture: arm64 }
          - { rid: win-x64, runner: windows-2025, architecture: x64 }
          - { rid: win-arm64, runner: windows-11-vs2026-arm, architecture: arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable Windows long paths before checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.19.0"
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - name: Isolate SDK selection
        run: printf 'DOTNET_INSTALL_DIR=%s/dotnet\nDOTNET_ROOT=%s/dotnet\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.111"
          architecture: ${{ matrix.architecture }}
      - run: npm run setup
      - name: Show delivery plan
        run: npm run dist -- --rid "$RID" --no-restore --plan
      - name: Build native artifacts
        id: native-build
        run: |
          mkdir -p "artifacts/delivery/logs/$RID"
          npm run build:native -- --rid "$RID" --no-restore 2>&1 | tee "artifacts/delivery/logs/$RID/build.log"
      - name: Bundle downloadable CLI binary
        id: binary-bundle
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          suffix=""
          if [[ "$RID" == win-* ]]; then suffix=".exe"; fi
          mkdir -p "artifacts/downloads/$RID/content"
          cp "artifacts/publish/$RID/open-forge/OpenForge.Cli$suffix" "artifacts/downloads/$RID/content/open-forge$suffix"
          chmod +x "artifacts/downloads/$RID/content/open-forge$suffix"
          cp LICENSE "artifacts/downloads/$RID/content/LICENSE"
          printf 'Development build for %s. Check this workflow run for test results before use.\n' "$RID" > "artifacts/downloads/$RID/content/README.txt"
          tar -czf "artifacts/downloads/$RID/open-forge-$RID.tar.gz" -C "artifacts/downloads/$RID/content" .
          (cd "artifacts/downloads/$RID" && sha256sum "open-forge-$RID.tar.gz" > SHA256SUMS)
      - name: Upload downloadable CLI binary
        if: ${{ !cancelled() && steps.binary-bundle.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-${{ matrix.rid }}
          path: |
            artifacts/downloads/${{ matrix.rid }}/*.tar.gz
            artifacts/downloads/${{ matrix.rid }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Test managed and native suites
        run: npm run test:built -- --rid "$RID" 2>&1 | tee "artifacts/delivery/logs/$RID/test.log"
      - name: Pack and test npm installation
        run: npm run pack -- --rid "$RID" 2>&1 | tee "artifacts/delivery/logs/$RID/pack.log"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package-${{ matrix.rid }}
          path: |
            artifacts/delivery/${{ matrix.rid }}/packages/*.tar.gz
            artifacts/delivery/${{ matrix.rid }}/packages/*.tgz
            artifacts/delivery/${{ matrix.rid }}/packages/package.json
            artifacts/delivery/${{ matrix.rid }}/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: diagnostics-${{ matrix.rid }}
          path: |
            artifacts/delivery/logs/${{ matrix.rid }}
            artifacts/delivery/${{ matrix.rid }}/reports
          if-no-files-found: ignore
          retention-days: 7

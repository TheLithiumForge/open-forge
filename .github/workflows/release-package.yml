name: Package tested native artifacts

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      build_run_id:
        type: string
        required: true
      matrix:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-${{ matrix.rid }}.tar
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-decompress: true
          digest-mismatch: error
      - run: tar -xf tested-${{ matrix.rid }}.tar
      - run: npm run pack -- --rid ${{ matrix.rid }}
      - name: Select packaged output
        id: package
        run: printf 'path=%s\n' "$(cat artifacts/delivery/${{ matrix.rid }}/package-path.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.rid }}
          path: |
            ${{ steps.package.outputs.path }}/*.tar.gz
            ${{ steps.package.outputs.path }}/*.tgz
            ${{ steps.package.outputs.path }}/package.json
            ${{ steps.package.outputs.path }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

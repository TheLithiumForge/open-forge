name: CLI artifacts

# Register this workflow on the default branch before manual dispatch is available.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_MULTILEVEL_LOOKUP: "0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CANDIDATE_VERSION: 0.0.0-dev.sha-${{ github.sha }}
  SOURCE_TAR: open-forge-source-${{ github.run_id }}-${{ github.run_attempt }}.tar

jobs:
  verify:
    uses: ./.github/workflows/cli.yml

  package:
    name: package ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            architecture: x64
            suffix: ""
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
            suffix: ""
          - rid: osx-x64
            runner: macos-15-intel
            architecture: x64
            suffix: ""
          - rid: osx-arm64
            runner: macos-15
            architecture: arm64
            suffix: ""
          - rid: win-x64
            runner: windows-2025
            architecture: x64
            suffix: ".exe"
          - rid: win-arm64
            runner: windows-11-vs2026-arm
            architecture: arm64
            suffix: ".exe"
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      RECEIPTS: artifacts/ci/receipts/${{ matrix.rid }}/package
      BUILD_TAR: open-forge-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rid }}.tar
      TEST_TAR: open-forge-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rid }}.tar
      PACKAGE_TAR: open-forge-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rid }}.tar
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set the job-owned SDK installation directory
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/open-forge-dotnet\nDOTNET_ROOT=%s/open-forge-dotnet\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Select isolated .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.111"
          architecture: ${{ matrix.architecture }}

      - name: Select native Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false

      - name: Select native Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Qualify native host, tools and checked-out source
        id: host
        run: |
          node src/cli/ci/host-receipt.ts ${{ matrix.rid }} package
          npm --version > "$RECEIPTS/npm-version.txt"

      - name: Download the tested current-run build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.BUILD_TAR }}
          path: artifacts/ci/transfers
          skip-decompress: true
          digest-mismatch: error

      - name: Download successful matching test receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.TEST_TAR }}
          path: artifacts/ci/transfers
          skip-decompress: true
          digest-mismatch: error

      - name: Restore and verify tested candidate
        run: |
          tar -xf "artifacts/ci/transfers/$BUILD_TAR"
          tar -xf "artifacts/ci/transfers/$TEST_TAR"
          node src/cli/ci/artifact-manifest.ts verify . artifacts/ci/candidate.json "artifacts/ci/receipts/$RID/build-manifest.json" ${{ runner.os != 'Windows' }}
          node src/cli/ci/artifact-manifest.ts verify . artifacts/ci/candidate.json "artifacts/ci/receipts/$RID/test-manifest.json" ${{ runner.os != 'Windows' }}
          bun install --frozen-lockfile
          bun pm ls --all > "$RECEIPTS/bun-dependencies.txt"

      - name: Run the existing native installed-package journey
        run: |
          npm run test:package-native -- "artifacts/ci/package-$RID" "$RID" "artifacts/publish/$RID/open-forge/OpenForge.Cli${{ matrix.suffix }}" local "$GITHUB_SHA" "$CANDIDATE_VERSION" > "$RECEIPTS/journey.stdout" 2> "$RECEIPTS/journey.stderr"
          node src/cli/ci/package-export.ts . artifacts/ci/candidate.json "$RID" "artifacts/ci/package-$RID/receipt.json" "$RECEIPTS/export.json"

      - name: Transfer the exact tested packages and linked receipts
        run: |
          node src/cli/ci/artifact-manifest.ts snapshot . artifacts/ci/candidate.json "artifacts/ci/receipts/$RID/package-manifest.json" "artifacts/ci/package-$RID/packs" "artifacts/ci/package-$RID/receipt.json" "artifacts/publish/$RID/open-forge" "artifacts/ci/receipts/$RID"
          tar -cf "$PACKAGE_TAR" "artifacts/ci/package-$RID/packs" "artifacts/ci/package-$RID/receipt.json" "artifacts/publish/$RID/open-forge" "artifacts/ci/receipts/$RID"

      - name: Upload bounded tested package bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.PACKAGE_TAR }}
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Preserve bounded failure diagnostics
        if: failure() && steps.host.outcome == 'success'
        run: |
          tar -cf "open-forge-package-failure-${{ github.run_id }}-${{ github.run_attempt }}-$RID.tar" "$RECEIPTS"

      - name: Upload failure diagnostics
        if: failure() && steps.host.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: open-forge-package-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rid }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect complete seven-package candidate
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      RECEIPTS: artifacts/ci/receipts/linux-x64/collect
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set the job-owned SDK installation directory
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/open-forge-dotnet\nDOTNET_ROOT=%s/open-forge-dotnet\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Select isolated .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.111"
          architecture: x64

      - name: Select native Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          architecture: x64
          package-manager-cache: false

      - name: Select native Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Qualify native host, tools and checked-out source
        id: host
        run: |
          node src/cli/ci/host-receipt.ts linux-x64 collect
          npm --version > "$RECEIPTS/npm-version.txt"

      - name: Download linux-x64 package bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: open-forge-package-${{ github.run_id }}-${{ github.run_attempt }}-linux-x64.tar
          path: artifacts/ci/transfers
          skip-decompress: true
          digest-mismatch: error

      - name: Download linux-arm64 package bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: open-forge-package-${{ github.run_id }}-${{ github.run_attempt }}-linux-arm64.tar
          path: artifacts/ci/transfers
          skip-decompress: true
          digest-mismatch: error

      - name: Download osx-x64 package bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: open-forge-package-${{ github.run_id }}-${{ github.run_attempt }}-osx-x64.tar
          path: artifacts/ci/transfers
          skip-decompress: true
          digest-mismatch: error

      - name: Download osx-arm64 package bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: open-forge-package-${{ github.run_id }}-${{ github.run_attempt }}-osx-arm64.tar
          path: artifacts/ci/transfers
          skip-decompress: true
          digest-mismatch: error

      - name: Download win-x64 package bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: open-forge-package-${{ github.run_id }}-${{ github.run_attempt }}-win-x64.tar
          path: artifacts/ci/transfers
          skip-decompress: true
          digest-mismatch: error

      - name: Download win-arm64 package bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: open-forge-package-${{ github.run_id }}-${{ github.run_attempt }}-win-arm64.tar
          path: artifacts/ci/transfers
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SOURCE_TAR }}
          path: artifacts/ci/source
          skip-decompress: true
          digest-mismatch: error

      - name: Verify all six explicit bundles and their complete package graph
        run: |
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64; do
            tar -xf "artifacts/ci/transfers/open-forge-package-${{ github.run_id }}-${{ github.run_attempt }}-$rid.tar"
            node src/cli/ci/artifact-manifest.ts verify . artifacts/ci/candidate.json "artifacts/ci/receipts/$rid/package-manifest.json" false
          done
          node src/cli/ci/collect-packages.ts . artifacts/ci/candidate.json artifacts/ci/receipts/linux-x64/build/source-entry.json "$RECEIPTS/collection.json" artifacts/ci/receipts/linux-x64/package/bundle.json artifacts/ci/receipts/linux-arm64/package/bundle.json artifacts/ci/receipts/osx-x64/package/bundle.json artifacts/ci/receipts/osx-arm64/package/bundle.json artifacts/ci/receipts/win-x64/package/bundle.json artifacts/ci/receipts/win-arm64/package/bundle.json
          node src/cli/ci/artifact-manifest.ts snapshot . artifacts/ci/candidate.json "$RECEIPTS/collection-manifest.json" artifacts/ci/source artifacts/ci/package-linux-x64/packs artifacts/ci/package-linux-arm64/packs artifacts/ci/package-osx-x64/packs artifacts/ci/package-osx-arm64/packs artifacts/ci/package-win-x64/packs artifacts/ci/package-win-arm64/packs artifacts/publish/linux-x64/open-forge artifacts/publish/linux-arm64/open-forge artifacts/publish/osx-x64/open-forge artifacts/publish/osx-arm64/open-forge artifacts/publish/win-x64/open-forge artifacts/publish/win-arm64/open-forge artifacts/ci/receipts
          node src/cli/ci/artifact-manifest.ts verify . artifacts/ci/candidate.json "$RECEIPTS/collection-manifest.json" true
          tar -cf "open-forge-candidate-${{ github.run_id }}-${{ github.run_attempt }}.tar" artifacts/ci/source artifacts/ci/package-linux-x64/packs artifacts/ci/package-linux-arm64/packs artifacts/ci/package-osx-x64/packs artifacts/ci/package-osx-arm64/packs artifacts/ci/package-win-x64/packs artifacts/ci/package-win-arm64/packs artifacts/publish/linux-x64/open-forge artifacts/publish/linux-arm64/open-forge artifacts/publish/osx-x64/open-forge artifacts/publish/osx-arm64/open-forge artifacts/publish/win-x64/open-forge artifacts/publish/win-arm64/open-forge artifacts/ci/receipts

      - name: Upload bounded verified candidate collection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: open-forge-candidate-${{ github.run_id }}-${{ github.run_attempt }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 7
